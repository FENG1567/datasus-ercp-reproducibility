    core_conclusion: "The January 2021 boundary is an observation-window and left-censoring boundary, so observed uptake and first observed coded use must not be read as a national implementation start."
    archetype: schematic-led composite
    hero_support_panel_map:
      hero: "a: hash-locked policy and SIGTAP/CID evidence timeline"
      support:
        - "b: 2021-2025 source-data window with January-2021 left-censoring"
        - "c: Cohort A and Cohort B construction using the unique-AIH unit"
    evidence_level: descriptive
    registry_result_ids:
      - cohort.a_unique_aih
      - cohort.b_final_unique_aih
      - uptake.left_censored_202101
      - uptake.hospitals_ever_observed
    inputs:
      - path: reports/policy_timeline_evidence.md
        sha256: b4351f069e5cdceb378a0da015382df77d1ab3e211ff940937b9e5933f577ed3
