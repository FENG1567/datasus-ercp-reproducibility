scope: "Seven main figures and four main tables; contract only, before any figure/table input generation or rendering."
release_rules:
  plotting_backend: R
  backend_exclusivity: "R only for drawing, previewing, export, and visual QA; no Python graphics device."
  registry_linkage: "Every displayed value must resolve to the immutable rc_v1 registry or a listed hash-locked policy artifact; plotting code may not redefine cohorts, filters, estimands, or suppression."
  data_raw: read_only
  thread_limit: 8
  no_credentials_in_outputs: true
  privacy_gate: "No unsuppressed displayed cell count below 5; maps and network displays use pre-specified aggregation or suppression."
  shared_inputs:
    - path: config/stage07_release_blueprint_v1.yaml
      sha256: cdcb38448c747ce748c46fc185a88b30da3a700a4cfb82a95dd57e8d63bddfae
