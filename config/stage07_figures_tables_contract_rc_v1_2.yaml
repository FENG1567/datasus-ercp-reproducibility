      role: registry_specification_and_result_locator_contract
  fixed_terminology:
    first_observed_coded_use: "first observed coded use"
    observed_uptake: "observed uptake"
    patient_flow_network: "patient-flow network"
    reimbursement: "SUS reimbursement in December-2025 BRL; not cost"
    resilience: "structural stress test simulation; not a real-world counterfactual"
  universal_prohibited_causal_phrasing:
    - causal
    - policy effect
    - treatment effect
    - caused
    - causes
    - effect of hub removal
  universal_qa_gates:
